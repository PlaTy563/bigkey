name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # タグpush時にGitHub Releaseへ添付するために必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHubのubuntu runnerにはAndroid SDKが入っているため、setup-androidは使わない。
      # 未承諾のライセンスがあればここで承諾する（失敗してもビルドは止めない）。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # リリース用keystoreはSecretsが設定されている場合のみ復元する。
      # 未設定ならデバッグ署名にフォールバックする（app/build.gradle.kts側で判定）。
      - name: Prepare release keystore (only when secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build debug and release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # ログを外から読めない環境向け: 失敗時にコンパイルエラーとテスト結果を注釈として残す
      - name: Show compile errors as annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log"; do
            [ -f "$f" ] && grep -E "^e: |error:|What went wrong" -A2 "$f" || true
          done | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          grep -h -o 'testcase name="[^"]*"[^>]*>' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -5 || true
          grep -h -o '<failure message="[^"]*"' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      # ダウンロード後に版が分かるよう、APKにバージョン入りの名前を付ける
      - name: Rename APKs with version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/bigkey-v${version}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/bigkey-v${version}-debug.apk"

      # artifactストレージ枠を使い切らないよう、保持期間は3日にする
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/*/*.apk
          retention-days: 3

      # タグ(v*)のときはAPKをReleaseに添付して恒久保存する（artifact枠を消費しない）
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/*/*.apk

      # タグをpushできない場合の経路:
      # mainへのコミットメッセージが「release:」で始まるときは、
      # app/build.gradle.ktsのversionNameからタグ(v<versionName>)とReleaseをGitHub側で作る。
      - name: Read versionName
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release from main
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/*/*.apk
